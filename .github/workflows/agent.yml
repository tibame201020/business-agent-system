name: Autonomous business controller
on:
  workflow_dispatch:
  schedule:
    - cron: '30 1 * * *'
permissions:
  contents: write
  issues: write
  models: read
concurrency:
  group: business-controller-state
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Live decision and real public source operations
        id: agent
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m agent.cli tick --max-steps 3
      - name: Persist public state including blocked receipts
        if: always()
        run: |
          git config user.name 'business-agent[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/public/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'agent: persist autonomous business operation receipts'
            git push
          fi
      - name: Propagate actual agent failure
        if: steps.agent.outcome == 'failure'
        run: exit 1
