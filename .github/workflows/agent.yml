name: Business agent acceptance and optional hosted planner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  models: read
concurrency:
  group: business-controller-state
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Agent regression
        run: python -m unittest discover -s tests -v
      - name: Registered builder regression
        working-directory: templates/ci_flake_audit
        run: python -m unittest discover -s tests -v
      - name: Optional hosted model cycle (explicit verified endpoint only)
        id: agent
        if: ${{ github.event_name == 'workflow_dispatch' && vars.BUSINESS_MODEL_URL != '' }}
        continue-on-error: true
        env:
          BUSINESS_MODEL_URL: ${{ vars.BUSINESS_MODEL_URL }}
          BUSINESS_MODEL_TOKEN: ${{ secrets.BUSINESS_MODEL_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m agent.cli tick --max-steps 1
      - name: Persist public state including blocked receipts
        if: always()
        run: |
          git config user.name 'business-agent[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/public/state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'agent: persist public business operation receipts'
            git push
          fi
      - name: Propagate hosted planner failure
        if: steps.agent.outcome == 'failure'
        run: exit 1
